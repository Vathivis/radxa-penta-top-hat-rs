[fan]
# CPU temperature thresholds in degrees Celsius.
lv0 = 50
lv1 = 60
lv2 = 67.5
lv3 = 75

[key]
click = slider
twice = switch
press = none

[time]
twice = 0.7
press = 1.8

[oled]
rotate = false
f-temp = false
auto_slide = true
auto_slide_time = 10
sleep = 0

[disk]
extra =

[fan_drives]
# Install smartmontools and list explicitly selected disks before enabling.
enabled = false
devices =
lv0 = 45
lv1 = 50
lv2 = 55
lv3 = 60
poll_seconds = 30

[fan_curve]
# Disabled by default to retain the original stepped fan behavior.
enabled = false
duty0 = 25
duty1 = 50
duty2 = 75
duty3 = 100
tail = extrapolate
max_duty = 100
hysteresis = 1
ramp_down = 0
